<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoWay</title>
    <link rel="stylesheet" href="./src/css/style.css">
    <link name="favicon" type="image/png" href="./src/assets/images/faviconEco.png" rel="shortcut icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <section id="intro" class="preventClicks">
      <div class="introContainer bgBlack" id="introContainer">
        <div class="ladoEsquerdo">
          <img class="planta" src="./src/assets/images/intro/planta-esquerda.png" alt="Planta Esquerda">
          <img class="folha" id="folhaE1" src="./src/assets/images/intro/folhaCaidaE1.png" alt="Folha Caida">
          <img class="folha" id="folhaE2" src="./src/assets/images/intro/folhaCaidaE2.png" alt="Folha Caida">
        </div>
  
        <div class="ladoDireito">
          <img class="planta" src="./src/assets/images/intro/planta-direita.png" alt="Planta Direita">
          <img class="folha" id="folhaD" src="./src/assets/images/intro/folhaCaidaD.png" alt="Folha Caida">
        </div>
      </div>
    </section>

    <header>
      <section id="headerContent" class="container">
        <img src="./src/assets/images/logo.png" alt="Logo EcoWay">
        <nav>
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Sobre</a></li>
            <li><a href="#">Serviços</a></li>
            <li><a href="#">Contato</a></li>
          </ul>
      </section>
    </header>

    <script src="./src/js/script.js"></script>
  </body>
</html>
